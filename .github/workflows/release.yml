name: build

# Every push to main: tests + both installers as workflow artifacts.
# Tag v*: a GitHub Release with fixed asset names, so
#   https://github.com/Minfdev/bibicord/releases/latest/download/BibiCord-Setup.exe
#   https://github.com/Minfdev/bibicord/releases/latest/download/BibiCord.dmg
# always point at the newest version (the in-app updater uses the same files).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Installer
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          command -v makensis || choco install nsis -y --no-progress
          scripts/build-windows-installer.sh
          cp dist/BibiCord-Setup-*.exe dist/BibiCord-Setup.exe
      - uses: actions/upload-artifact@v5
        with:
          name: BibiCord-windows
          path: dist/BibiCord-Setup.exe

  macos:
    # Apple Silicon only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - uses: astral-sh/setup-uv@v6
      - name: Installer
        run: |
          scripts/build-macos-dmg.sh
          cp dist/BibiCord-*.dmg dist/BibiCord.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: BibiCord-macos
          path: dist/BibiCord.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: FFmpeg source (GPL)
        run: |
          . packaging/ffmpeg.env
          scripts/fetch.sh "$FFMPEG_WIN_SOURCE_URL" "" dist/ffmpeg-source-windows.tar.gz
          scripts/fetch.sh "$FFMPEG_MAC_SOURCE_URL" "$FFMPEG_MAC_SOURCE_SHA256" dist/ffmpeg-source-macos.tar.xz
      - name: Checksums and notes
        run: |
          cd dist && sha256sum BibiCord-Setup.exe BibiCord.dmg ffmpeg-source-windows.tar.gz ffmpeg-source-macos.tar.xz > SHA256SUMS.txt && cd ..
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/BibiCord-Setup.exe
            dist/BibiCord.dmg
            dist/SHA256SUMS.txt
            dist/ffmpeg-source-windows.tar.gz
            dist/ffmpeg-source-macos.tar.xz
