name: build

# Push to main and PRs: tests only (main also refreshes the Rust cache).
# Manual run (workflow_dispatch): tests + both installers as workflow artifacts.
# Tag v*: tests + installers + a GitHub Release with fixed asset names, so
#   https://github.com/Minfdev/bibicord/releases/latest/download/BibiCord-Setup.exe
#   https://github.com/Minfdev/bibicord/releases/latest/download/BibiCord.dmg
# always point at the newest version (the in-app updater uses the same files).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Installers only for releases and manual runs; jobs repeat the expression
  # in their `if` because `env` is not available there.
  INSTALLERS: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  # FFmpeg for Windows, cross-compiled from source (scripts/build-ffmpeg.sh).
  # Cached until packaging/ffmpeg.env or the build script changes.
  ffmpeg-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: cache
        with:
          path: target/pkg/ffmpeg/windows
          key: ffmpeg-windows-${{ hashFiles('packaging/ffmpeg.env', 'scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nasm cmake pkg-config make
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          scripts/build-ffmpeg.sh windows
      - uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-windows
          path: target/pkg/ffmpeg/windows

  windows:
    needs: ffmpeg-windows
    # Runs also when ffmpeg-windows is skipped (no installers).
    if: ${{ !cancelled() && needs.ffmpeg-windows.result != 'failure' }}
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Debug: with LTO the release test binary takes ~3 min to link.
      - run: cargo test
      - uses: taiki-e/install-action@v2
        if: env.INSTALLERS == 'true'
        with:
          tool: cargo-about
      - uses: actions/download-artifact@v5
        if: env.INSTALLERS == 'true'
        with:
          name: ffmpeg-windows
          path: target/pkg/ffmpeg/windows
      - name: Check FFmpeg
        if: env.INSTALLERS == 'true'
        shell: bash
        run: scripts/check-ffmpeg.sh target/pkg/ffmpeg/windows/ffmpeg.exe
      - name: Installer
        if: env.INSTALLERS == 'true'
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          command -v makensis || choco install nsis -y --no-progress
          scripts/build-windows-installer.sh target/pkg/ffmpeg/windows/ffmpeg.exe
          cp dist/BibiCord-Setup-*.exe dist/BibiCord-Setup.exe
      - uses: actions/upload-artifact@v5
        if: env.INSTALLERS == 'true'
        with:
          name: BibiCord-windows
          path: dist/BibiCord-Setup.exe

  macos:
    # Apple Silicon only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test
      - uses: taiki-e/install-action@v2
        if: env.INSTALLERS == 'true'
        with:
          tool: cargo-about
      - uses: actions/cache@v4
        if: env.INSTALLERS == 'true'
        id: ffmpeg-cache
        with:
          path: target/pkg/ffmpeg/macos
          key: ffmpeg-macos-${{ hashFiles('packaging/ffmpeg.env', 'scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: env.INSTALLERS == 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          command -v pkg-config || brew install pkgconf
          scripts/build-ffmpeg.sh macos
      - name: Check FFmpeg
        if: env.INSTALLERS == 'true'
        run: scripts/check-ffmpeg.sh target/pkg/ffmpeg/macos/ffmpeg
      - uses: astral-sh/setup-uv@v6
        if: env.INSTALLERS == 'true'
      - name: Installer
        if: env.INSTALLERS == 'true'
        run: |
          scripts/build-macos-dmg.sh target/pkg/ffmpeg/macos/ffmpeg
          cp dist/BibiCord-*.dmg dist/BibiCord.dmg
      - uses: actions/upload-artifact@v5
        if: env.INSTALLERS == 'true'
        with:
          name: BibiCord-macos
          path: dist/BibiCord.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: BibiCord-*
          path: dist
          merge-multiple: true
      - name: FFmpeg source (GPL)
        run: scripts/ffmpeg-source.sh dist/ffmpeg-source.tar
      - name: Checksums and notes
        run: |
          cd dist && sha256sum BibiCord-Setup.exe BibiCord.dmg ffmpeg-source.tar > SHA256SUMS.txt && cd ..
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/BibiCord-Setup.exe
            dist/BibiCord.dmg
            dist/SHA256SUMS.txt
            dist/ffmpeg-source.tar
