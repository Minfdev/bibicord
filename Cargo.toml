[package]
name = "bibicord"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.37.0"
egui-pop-phosphor = { version = "0.15.0", features = ["fill"] }
ffmpeg-sidecar = "2.7.0"
nnnoiseless = { version = "0.5.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
iroh = "1.4.1"
opus = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rfd = "0.18.0"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.2", features = ["macos_14_0"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
embed-resource = "3.0.12"
