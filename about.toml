# cargo-about: licenses of third-party crates shipped in the installers.
# `cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html`
# A dependency under a license outside this list fails generation (and CI).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
